[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taste-format"
version = "0.1.0"
description = "Read and write .taste files: collections of media that share a vibe, in one portable file."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["pillow>=11,<13"]
dev = [
  "jsonschema>=4.23,<5",
  "pillow>=11,<13",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/RUverse/taste"
Issues = "https://github.com/RUverse/taste/issues"

[project.scripts]
taste = "taste.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/taste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
